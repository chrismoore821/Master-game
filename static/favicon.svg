<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon - simplified version -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="url(#faviconGradient)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
  
  <!-- Controller design -->
  <g transform="translate(16, 16)">
    <!-- Left stick -->
    <circle cx="-6" cy="-3" r="2.5" fill="none" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="-6" cy="-3" r="1.2" fill="#00ff88"/>
    
    <!-- Right stick -->
    <circle cx="6" cy="3" r="2.5" fill="none" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="6" cy="3" r="1.2" fill="#00ff88"/>
    
    <!-- Pulse wave -->
    <path d="M -8,6 Q -4,4 0,6 T 8,6" stroke="#00ff88" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>
</svg>