<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Neon outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  
  <!-- Gaming controller outline -->
  <g transform="translate(100, 100)">
    <!-- Left stick -->
    <circle cx="-35" cy="-15" r="12" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <circle cx="-35" cy="-15" r="6" fill="#00ff88" opacity="0.8"/>
    
    <!-- Right stick -->
    <circle cx="35" cy="15" r="12" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <circle cx="35" cy="15" r="6" fill="#00ff88" opacity="0.8"/>
    
    <!-- D-pad (left side) -->
    <rect x="-50" y="-8" width="8" height="6" fill="#00ff88" opacity="0.9"/>
    <rect x="-46" y="-12" width="6" height="8" fill="#00ff88" opacity="0.9"/>
    
    <!-- Action buttons (right side) -->
    <circle cx="50" cy="-10" r="4.5" fill="#ff0055" opacity="0.85"/>
    <circle cx="58" cy="-2" r="4.5" fill="#00ff88" opacity="0.85"/>
    <circle cx="50" cy="6" r="4.5" fill="#ffff00" opacity="0.85"/>
    <circle cx="42" cy="-2" r="4.5" fill="#00ccff" opacity="0.85"/>
    
    <!-- Center bar -->
    <rect x="-20" y="-4" width="40" height="8" fill="none" stroke="#00ff88" stroke-width="2" rx="2"/>
    
    <!-- Pulse wave accent -->
    <path d="M -30,30 Q -20,25 -10,30 T 10,30 T 30,30" stroke="#00ff88" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00ff88" text-anchor="middle" letter-spacing="1">GAME PULSE</text>
</svg>