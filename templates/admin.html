<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GamePulse // Admin</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="cyber-grid"></div>

    <div class="admin-shell">
      <header class="topbar admin-topbar">
        <div class="brand-wrap">
          <div class="brand-mark">G</div>
          <span class="brand-name">GamePulse Admin</span>
        </div>

        <nav class="main-nav">
          <a href="/" class="nav-link">Home</a>
          <a href="/logout" class="nav-link">Logout</a>
        </nav>
      </header>

      <main class="admin-layout">
        <section class="admin-panel form-panel">
          <div class="section-heading small">
            <span class="heading-kicker">upload</span>
            <h2>Add new title</h2>
          </div>

          <form method="POST" class="admin-form">
            <div class="field-group">
              <label for="title">Game title</label>
              <input id="title" type="text" name="title" placeholder="Enter game title" required />
            </div>

            <div class="field-group">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="Action">Action</option>
                <option value="Racing">Racing</option>
                <option value="Adventure">Adventure</option>
                <option value="Strategy">Strategy</option>
                <option value="Shooter">Shooter</option>
                <option value="Sports">Sports</option>
              </select>
            </div>

            <div class="field-group">
              <label for="desc">Description</label>
              <textarea id="desc" name="desc" rows="4" placeholder="Brief description"></textarea>
            </div>

            <div class="field-group">
              <label for="link">Store link</label>
              <input id="link" type="text" name="link" placeholder="Game store URL" required />
            </div>

            <div class="field-group">
              <label for="store_type">Store type</label>
              <select id="store_type" name="store_type">
                <option value="steam">Steam</option>
                <option value="epic">Epic</option>
                <option value="xbox">Xbox</option>
                <option value="playstation">PlayStation</option>
                <option value="gog">GOG</option>
                <option value="store">Other store</option>
              </select>
            </div>

            <div class="field-group">
              <label for="store_name">Store name</label>
              <input id="store_name" type="text" name="store_name" placeholder="Steam, Epic, Xbox, etc." />
            </div>

            <div class="field-group">
              <label for="affiliate_link">Affiliate link</label>
              <input id="affiliate_link" type="text" name="affiliate_link" placeholder="Optional affiliate URL (use this if you have one)" />
              <small id="affiliate_preview" class="affiliate-preview">Preview: no affiliate link selected yet</small>
            </div>

            <div class="field-group">
              <label for="img">Image URL</label>
              <input id="img" type="text" name="img" placeholder="Image URL" />
            </div>

            <div class="field-group">
              <label for="video">Gameplay video URL</label>
              <input id="video" type="text" name="video" placeholder="MP4 video URL" />
            </div>

            <button type="submit" class="primary-btn submit-btn">Add game</button>
          </form>
        </section>

        <section class="admin-panel list-panel">
          <div class="section-heading small">
            <span class="heading-kicker">system</span>
            <h2>Current library</h2>
          </div>

          <ul class="games-list">
            {% for game in games %}
              <li class="game-item">
                <div class="list-item-main">
                  <span>{{ game.title }}</span>
                  <small>{{ game.category }}</small>
                </div>
                <a href="/delete/{{ game.id }}" class="delete-btn">Delete</a>
              </li>
            {% endfor %}
          </ul>
        </section>
      </main>
    </div>

    <script>
      const linkInput = document.getElementById('link');
      const affiliateInput = document.getElementById('affiliate_link');
      const storeTypeInput = document.getElementById('store_type');
      const storeNameInput = document.getElementById('store_name');
      const preview = document.getElementById('affiliate_preview');

      function renderPreview() {
        const baseLink = (linkInput.value || '').trim();
        const affiliateLink = (affiliateInput.value || '').trim();
        const selectedType = (storeTypeInput.value || 'store').trim();
        const customName = (storeNameInput.value || '').trim();
        const storeName = customName || selectedType.charAt(0).toUpperCase() + selectedType.slice(1);

        if (affiliateLink) {
          preview.textContent = 'Preview: ' + affiliateLink;
          return;
        }

        if (baseLink) {
          preview.textContent = 'Preview: ' + baseLink + '?utm_source=gamepulse&utm_medium=affiliate&utm_campaign=' + encodeURIComponent(storeName.toLowerCase().replace(/\s+/g, '-'));
          return;
        }

        preview.textContent = 'Preview: no affiliate link selected yet';
      }

      [linkInput, affiliateInput, storeTypeInput, storeNameInput].forEach((input) => {
        input.addEventListener('input', renderPreview);
        input.addEventListener('change', renderPreview);
      });
    </script>
  </body>
</html>
