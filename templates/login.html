<!DOCTYPE html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3107628298197893"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GamePulse // Admin Access</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="cyber-grid"></div>

    <div class="login-shell">
      <div class="login-card">
        <span class="hero-badge">secure access</span>
        <h1>Admin login</h1>
        <p>Enter the password to manage the game library.</p>

        <form method="POST" class="login-form">
          <input type="password" name="password" placeholder="Password" required />
          {% if error %}
            <p class="error-message">{{ error }}</p>
          {% endif %}
          <button type="submit" class="primary-btn">Unlock dashboard</button>
        </form>
      </div>
    </div>
  </body>
</html>
